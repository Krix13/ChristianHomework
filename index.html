<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Photo Gallery</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="dist/css/lightbox.css">
	
</head>
<body onload = "setImages()">
	<header>
    <img id = "header_img" src="" width="200" alt="Brown Labradoodle sitting next to a statue.">
    <h1>Hello there</h1>
  </header>


	<div id = "image">
		Hover over an image below to display here.
	</div>

	
    <a href="images/alvin.png" data-lightbox = "images" data-title="Caption 1">
    <img src="images/alvin.png" class = "preview" alt="dude" width="100" onmouseover = "upDate(this)" onmouseout = "unDo(this)">
    </a>

	<a href="images/christian.png" data-lightbox = "images" data-title="Caption 1">
    <img src="images/christian.png" class = "preview" alt="cool dude" width="100" onmouseover = "upDate(this)" onmouseout = "unDo(this)">
    </a>

		<a href="images/dennis.png" data-lightbox = "images" data-title="Caption 1">
    <img src="images/dennis.png" class = "preview" alt="glasses dude" width="100" onmouseover = "upDate(this)" onmouseout = "unDo(this)">
    </a>

	<a href="images/forrest.jpg" data-lightbox = "images" data-title="Caption 1">
    <img src="images/forrest.jpg" class = "preview" alt="forrest" width="100" onmouseover = "upDate(this)" onmouseout = "unDo(this)">
    </a>
	
	<a href="images/korg.png" data-lightbox = "images" data-title="Caption 1">
    <img src="images/korg.png" class = "preview" alt="basket" width="100" onmouseover = "upDate(this)" onmouseout = "unDo(this)">
    </a>

		<a href="images/robert.png" data-lightbox = "images" data-title="Caption 1">
    <img src="images/robert.png" class = "preview" alt="beard dude" width="100" onmouseover = "upDate(this)" onmouseout = "unDo(this)">
    </a>



</body>
<script src = "js/script.js"></script>
<script src = "dist/js/lightbox-plus-jquery.js"></script>
</html>
